name: Sync Files Every 3 Hours (Exclude SELF)

on:
  # 每 3 小时运行一次
  schedule:
    - cron: "0 */3 * * *"

  # 可选：手动触发工作流
  workflow_dispatch:

jobs:
  sync-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: paniy-little/SWrt # 目标仓库
          ref: "24.10" # 目标分支
          path: target-repo # 将目标仓库克隆到本地目录

      - name: Backup SELF Directory in Target Repository
        run: |
          # 如果目标仓库中存在 SELF 目录，备份它
          if [ -d "target-repo/SELF" ]; then
            cp -r target-repo/SELF target-repo/SELF.backup
          fi

      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          repository: QiuSimons/YAOF # 源仓库
          ref: "24.10" # 源分支
          path: source-repo # 将源仓库克隆到本地目录

      - name: Copy Files from Source to Target and Restore SELF
        run: |
          # 使用 rsync 复制源仓库的所有文件到目标仓库，并覆盖目标文件
          rsync -av --delete source-repo/ target-repo/
          
          # 如果目标仓库中存在 SELF 备份，恢复它
          if [ -d "target-repo/SELF.backup" ]; then
            rm -rf target-repo/SELF
            mv target-repo/SELF.backup target-repo/SELF
          fi

      - name: Commit and Push Changes
        run: |
          cd target-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # 检查是否有更改
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add .
            git commit -m "Sync files from source repository (exclude SELF) at $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin 24.10
          fi