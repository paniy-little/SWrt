name: Sync Files Every 3 Hours (Exclude SELF and .github)

on:
  # 每 3 小时运行一次
  schedule:
    - cron: "0 */3 * * *"

  # 可选：手动触发工作流
  workflow_dispatch:

jobs:
  sync-files:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_branch: ["24.10", "25.12"]
      fail-fast: false  # 一个分支失败不影响另一个

    steps:
      - name: Checkout Target Repository (${{ matrix.target_branch }})
        uses: actions/checkout@v4
        with:
          repository: paniy-little/SWrt # 目标仓库
          ref: ${{ matrix.target_branch }} # 目标分支（动态：24.10或25.12）
          path: target-repo # 将目标仓库克隆到本地目录
          token: ${{ secrets.GITHUB_TOKEN }} # 使用 GITHUB_TOKEN 进行身份验证

      - name: Backup SELF Directory in Target Repository
        run: |
          # 如果目标仓库中存在 SELF 目录，备份它
          if [ -d "target-repo/SELF" ]; then
            cp -r target-repo/SELF target-repo/SELF.backup
          fi

      - name: Download Source Repository as Zip
        run: |
          # 直接下载源仓库的zip文件，避免需要git权限
          wget -O source-repo.zip https://github.com/QiuSimons/YAOF/archive/refs/heads/${{ matrix.target_branch }}.zip
          echo "Source repository zip file downloaded successfully"

      - name: Extract Source Repository
        run: |
          # 解压zip文件
          unzip -q source-repo.zip
          # 重命名解压后的目录为source-repo，保持与后续步骤兼容
          mv YAOF-${{ matrix.target_branch }} source-repo
          echo "Source repository extracted successfully"

      - name: Verify Source Repository Integrity
        run: |
          # 检查解压后的仓库是否包含必要的文件
          if [ ! -d "source-repo" ]; then
            echo "Error: Source repository extraction failed"
            exit 1
          fi
          echo "Source repository integrity verified successfully"

      - name: Copy Files from Source to Target and Restore SELF
        run: |
          # 使用 rsync 复制源仓库的所有文件到目标仓库，并排除 .github 和 SELF 目录
          # 移除 --delete 参数以避免意外删除目标仓库的特有文件
          rsync -av \
            --exclude='SELF' \
            --exclude='.github/' \
            source-repo/ target-repo/

          # 单独同步 .github/workflows/ 中的两个指定文件
          mkdir -p target-repo/.github/workflows/
          if [ -f "source-repo/.github/workflows/OpenWrt-Matrix.yml" ]; then
            cp "source-repo/.github/workflows/OpenWrt-Matrix.yml" "target-repo/.github/workflows/"
          fi
          if [ -f "source-repo/.github/workflows/X86-OpenWrt.yml" ]; then
            cp "source-repo/.github/workflows/X86-OpenWrt.yml" "target-repo/.github/workflows/"
          fi

          # 如果目标仓库中存在 SELF 备份，恢复它
          if [ -d "target-repo/SELF.backup" ]; then
            rm -rf target-repo/SELF
            mv target-repo/SELF.backup target-repo/SELF
          fi
          
          # 清理临时文件
          rm -f source-repo.zip
          rm -rf source-repo
          echo "Temporary files cleaned up successfully"

      - name: Stage Changes in Target Repository
        run: |
          cd target-repo
          git add .

      - name: Check for Differences and Commit/Push Changes
        run: |
          cd target-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # 使用更规范的ISO 8601时间格式
          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          if ! git diff --cached --quiet; then
            # 获取更新的文件列表
            changed_files=$(git diff --cached --name-only)
            # 计算更新的文件数量
            changed_count=$(echo "$changed_files" | wc -l)
            
            # 尝试提交，处理可能的冲突
            if git commit -m "Sync files from source repository (exclude SELF and .github) at $timestamp"; then
              echo "Commit successful, pushing changes..."
              if git push origin ${{ matrix.target_branch }}; then
                echo "Push successful"
                # 输出详细的更新信息到Annotations
                echo "::notice file=sync-files.yml,line=1,col=1::已成功从源仓库同步文件，共更新了 $changed_count 个文件。上次检查时间：$timestamp"
                echo "::notice file=sync-files.yml,line=2,col=1::更新的文件列表：$changed_files"
              else
                echo "Error: Push failed, please check permissions or network issues"
                exit 1
              fi
            else
              echo "Error: Commit failed, likely due to merge conflicts"
              echo "Current git status:"
              git status
              echo "Diff of changes:"
              git diff
              exit 1
            fi
          else
            echo "No differences found. No changes to commit."
            # 输出到Annotations，便于在GitHub Actions界面查看
            echo "::notice file=sync-files.yml,line=1,col=1::源仓库与目标仓库无差异，未提交任何更改。上次检查时间：$timestamp"
          fi

      - name: Debugging Information
        run: |
          cd target-repo
          git status
          git log -1
